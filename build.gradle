buildscript {
	repositories {
		maven {
			url = 'https://repo.spongepowered.org/repository/maven-public/'
		}
		mavenCentral()
	}
	dependencies {
		classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
	}
}

plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
	id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
	archivesName = "Steam-Letters"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
	mappings channel: mapping_channel, version: mapping_version
	copyIdeResources = true
	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		client {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		server {
			property 'forge.enabledGameTestNamespaces', mod_id
			args '--nogui'
		}

		gameTestServer {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		data {
			workingDirectory project.file('run-data')

			args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
		}
	}
}

mixin {
	add sourceSets.main, "${mod_id}.refmap.json"

	config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

repositories {
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
	}
	maven {
		url = "https://maven.createmod.net"
	}
	maven {
		name = "ForgeConfigAPIPort"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		name = "Tterrag Maven"
		url = "https://maven.tterrag.com/"
	}
	maven {
		name = "Mod Maven"
		url = "https://modmaven.dev/"
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
	maven {
		name = 'Latvian Mods (KubeJS, Rhino)'
		url = "https://maven.latvian.dev/releases"
	}
	maven {
		name = "DVS1 Maven FS & TCon"
		url = "https://dvs1.progwml6.com/files/maven"
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	// Jei
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
	runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

	// Create
	implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
	implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
	compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
	runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
	implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
	implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

	// 柴油动力
	implementation fg.deobf("curse.maven:create-diesel-generators-869316:7869519")

	// CC&A
	implementation fg.deobf("curse.maven:createaddition-439890:7208610")

	// Jade
	implementation fg.deobf("curse.maven:jade-324717:6106101")

	// Configured
	runtimeOnly fg.deobf("curse.maven:configured-457570:5180900")

	// KubeJS
	implementation fg.deobf("dev.architectury:architectury-forge:9.2.14")
	implementation fg.deobf("dev.latvian.mods:rhino-forge:2001.2.3-build.10")
	implementation fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.26")
	runtimeOnly fg.deobf("curse.maven:probejs-585406:5227399")

	// Oculus & Embeddium
	runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
	runtimeOnly fg.deobf("curse.maven:oculus-581495:6020952")

	// Mantel & Tinkers' Construct
	implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-1.11.117")
	implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-3.12.0.220")

	// Lomkok
	compileOnly("org.projectlombok:lombok:1.18.28")
	annotationProcessor("org.projectlombok:lombok:1.18.28")

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			forge_version          : forge_version,
			forge_version_range    : forge_version_range,
			loader_version_range   : loader_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties + [project: project]
	}
}

tasks.named('jar', Jar).configure {
	// 输出 jar 名：Steam-Letters-<mod_version>-<minecraft_version>.jar
	archiveVersion = "${mod_version}-${minecraft_version}"

	manifest {
		attributes([
				'Specification-Title'     : mod_id,
				'Specification-Vendor'    : mod_authors,
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.jar.archiveVersion,
				'Implementation-Vendor'   : mod_authors,
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}

	finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << "-parameters"
}